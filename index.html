<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Top Stats Bar: Wallet, Stake, & Deposit Button -->
        <div class="stats-bar">
            <div class="stat-box">
                <span class="stat-title">Wallet</span>
                <span class="stat-value" id="walletBalance">0.00</span>
            </div>
            <button id="depositBtn" onclick="openDepositModal()">Deposit <b>+</b></button>
            <div class="stat-box">
                <span class="stat-title">Stake</span>
                <span class="stat-value">10</span>
            </div>
        </div>

        <!-- Card Selector Grid (1 to 100) -->
        <div class="card-selector-grid" id="cardSelectorGrid"></div>

        <!-- Bottom Section: Selected Card Preview & Controls -->
        <div class="bottom-section">
            <div class="bingo-card" id="bingoCard"></div>

            <div class="action-buttons">
                <button id="refreshBtn" onclick="randomizeSelectedCard()">Refresh</button>
                <button id="startBtn" onclick="startGame()">Start game</button>
            </div>
        </div>
    </div>

    <!-- Telebirr Deposit Modal Popup -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <h3>Telebirr Deposit</h3>
            <p>Send funds via Telebirr to:</p>
            <div class="payment-option">
                <strong>Number:</strong> <span>0900071279</span>
            </div>
            <button id="closeModalBtn" onclick="closeDepositModal()">Close</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
