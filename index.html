<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Bingo</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Telegram & Firebase Libraries -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    /* In-App Toast Notification Banner */
    .toast-banner {
      position: fixed; 
      top: -70px; 
      left: 50%; 
      transform: translateX(-50%);
      background: #1e293b; 
      color: #fbbf24; 
      border: 1.5px solid #f59e0b;
      padding: 12px 24px;
      border-radius: 12px; 
      font-weight: 600; 
      font-size: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      z-index: 1000; 
      white-space: nowrap;
    }
    .toast-banner.show { top: 20px; }

    /* 30-Second Countdown Banner */
    .timer-banner {
      display: none; background-color: #2563eb; color: #fff;
      text-align: center; padding: 8px; margin: 10px 0; border-radius: 6px;
      font-weight: bold; font-size: 14px;
    }

    /* Reserved Cell Styling - Solid Blue */
    .selector-cell.occupied {
      background-color: #2563eb !important;
      color: #ffffff !important;
      pointer-events: none;
    }

    /* Debug ID banner */
    .debug-id {
      font-size: 10px; color: #64748b; text-align: center; margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Toast Notification Banner -->
  <div id="toastBanner" class="toast-banner"></div>

  <div class="game-container">
    
    <!-- Top Stats Bar -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-title">Wallet</span>
        <span class="stat-value" id="walletBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Bonus</span>
        <span class="stat-value" id="bonusBalance">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Active Game</span>
        <span class="stat-value" id="activeGames">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Stake</span>
        <span class="stat-value" id="stakeAmount">10</span>
      </div>
    </div>
    <div class="debug-id" id="debugUserDisplay">Connecting ID...</div>

    <!-- Countdown Timer Banner -->
    <div id="timerBanner" class="timer-banner">
      2 Cards Reserved! Game starting in <span id="countdown">30</span>s...
    </div>

    <!-- 100-Card Selector Grid -->
    <div class="card-selector-grid" id="cardSelectorGrid"></div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <div class="bingo-card" id="bingoCardPreview"></div>

      <div class="action-buttons">
        <button id="refreshBtn">Refresh</button>
        <button id="startBtn">Start game</button>
      </div>
    </div>

  </div>

  <script>
    // Your exact Firebase configuration keys
    const firebaseConfig = {
      apiKey: "AIzaSyCSPvq-XVlhjufHT-MHhjrirTk0W3d-nTg",
      authDomain: "addis-bingo-149fc.firebaseapp.com",
      databaseURL: "https://addis-bingo-149fc-default-rtdb.firebaseio.com",
      projectId: "addis-bingo-149fc",
      storageBucket: "addis-bingo-149fc.firebasestorage.app",
      messagingSenderId: "263720616222",
      appId: "1:263720616222:web:493bd0e0c08a22f2afc90f",
      measurementId: "G-QMN2VY8FRS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Telegram User ID Integration with Robust Fallback & Storage
    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    let currentUserId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null;
    
    // If Telegram WebApp ID isn't exposed directly, check local storage or URL hash, else fallback safely
    if (!currentUserId) {
      currentUserId = localStorage.getItem("addis_bingo_uid");
      if (!currentUserId) {
        currentUserId = "user_" + Math.floor(Math.random() * 90000 + 10000);
        localStorage.setItem("addis_bingo_uid", currentUserId);
      }
    }

    document.getElementById("debugUserDisplay").textContent = "ID: " + currentUserId;

    function showToast(msg) {
      const toast = document.getElementById("toastBanner");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function initGame() {
      const grid = document.getElementById("cardSelectorGrid");
      const preview = document.getElementById("bingoCardPreview");
      const startBtn = document.getElementById("startBtn");
      const refreshBtn = document.getElementById("refreshBtn");
      const activeGamesDisplay = document.getElementById("activeGames");
      const timerBanner = document.getElementById("timerBanner");
      const countdownDisplay = document.getElementById("countdown");

      let selectedCardIndex = 1;
      let currentReservations = {};
      let activeGames = 0;
      let drawnNumbers = [];
      let currentDrawTimer = null;

      // 1. Broad Balance Path Scanning (Finds balance across any format the bot used)
      const possiblePaths = [
        `users/${currentUserId}/balance`,
        `users/${currentUserId}/wallet`,
        `balances/${currentUserId}`,
        `players/${currentUserId}/balance`,
        `users/${currentUserId}`
      ];

      possiblePaths.forEach(path => {
        db.ref(path).on("value", (snapshot) => {
          if (snapshot.exists()) {
            let val = snapshot.val();
            // If the node is an object, check common property fields inside it
            if (typeof val === "object" && val !== null) {
              val = val.balance !== undefined ? val.balance : (val.wallet !== undefined ? val.wallet : null);
            }
            if (val !== null && !isNaN(val)) {
              const walletDisplay = document.getElementById("walletBalance");
              if (walletDisplay) {
                walletDisplay.textContent = Number(val).toFixed(2);
              }
            }
          }
        });
      });

      // Also scan all users root to see if we can find a matching record if ID differs
      db.ref("users").once("value", (snapshot) => {
        if (snapshot.exists()) {
          snapshot.forEach((childSnapshot) => {
            const key = childSnapshot.key;
            const data = childSnapshot.val();
            // If user name matches or if there's only one user record in testing, auto-sync
            if (data && (typeof data === "object") && (data.balance !== undefined || data.wallet !== undefined)) {
              // If current ID is a random fallback, adopt this active database key
              if (currentUserId.startsWith("user_") && !localStorage.getItem("addis_bingo_synced")) {
                currentUserId = key;
                localStorage.setItem("addis_bingo_uid", currentUserId);
                localStorage.setItem("addis_bingo_synced", "true");
                document.getElementById("debugUserDisplay").textContent = "ID: " + currentUserId + " (Synced)";
              }
            }
          });
        }
      });

      // 2. Selector Grid Rendering (Blue Reserved Cards)
      function renderGrid() {
        if (!grid) return;
        grid.innerHTML = "";
        const reservedIndices = Object.values(currentReservations).map(r => r.cardIndex);

        for (let i = 1; i <= 100; i++) {
          const cell = document.createElement("div");
          cell.className = "selector-cell";
          cell.textContent = i;

          if (reservedIndices.includes(i)) {
            cell.classList.add("occupied");
          }

          if (i === selectedCardIndex && !reservedIndices.includes(i)) {
            cell.classList.add("selected");
          }

          cell.addEventListener("click", () => {
            if (reservedIndices.includes(i)) return;
            document.querySelectorAll(".selector-cell").forEach(c => c.classList.remove("selected"));
            cell.classList.add("selected");
            selectedCardIndex = i;
            generatePreviewCard();
          });
          grid.appendChild(cell);
        }
      }

      // Deterministic Numbers Generator (Keeps numbers fixed for each Card ID)
      function getFixedNumbersForCard(cardId, colIndex, count) {
        const nums = [];
        const min = colIndex * 15 + 1;
        const max = (colIndex + 1) * 15;
        let seed = cardId * 100 + colIndex * 10;

        while (nums.length < count) {
          seed = (seed * 9301 + 49297) % 233280;
          const rand = min + Math.floor((seed / 233280) * (max - min + 1));
          if (!nums.includes(rand)) nums.push(rand);
        }
        return nums;
      }

      // 3. Fixed 5x5 Bingo Preview Card & Daub Updates
      function updateCardDaubs() {
        if (!preview) return;
        const cells = preview.querySelectorAll(".bingo-cell");
        cells.forEach(cell => {
          const val = parseInt(cell.textContent);
          if (!isNaN(val) && drawnNumbers.includes(val)) {
            cell.classList.add("daubed");
          }
        });
      }

      function generatePreviewCard() {
        if (!preview) return;
        preview.innerHTML = "";

        const colB = getFixedNumbersForCard(selectedCardIndex, 0, 5);
        const colI = getFixedNumbersForCard(selectedCardIndex, 1, 5);
        const colN = getFixedNumbersForCard(selectedCardIndex, 2, 5);
        const colG = getFixedNumbersForCard(selectedCardIndex, 3, 5);
        const colO = getFixedNumbersForCard(selectedCardIndex, 4, 5);

        for (let r = 0; r < 5; r++) {
          [colB[r], colI[r], colN[r], colG[r], colO[r]].forEach((num, c) => {
            const cell = document.createElement("div");
            cell.className = "bingo-cell";
            if (r === 2 && c === 2) {
              cell.textContent = "FREE";
              cell.classList.add("daubed");
            } else {
              cell.textContent = num;
              cell.addEventListener("click", () => {
                if (drawnNumbers.includes(num)) {
                  cell.classList.toggle("daubed");
                } else {
                  showToast("Number hasn't been drawn yet!");
                }
              });
            }
            preview.appendChild(cell);
          });
        }
        updateCardDaubs();
      }

      // 4. Card Reservation Enforcement with Direct Firebase Balance Check
      if (startBtn) {
        startBtn.addEventListener("click", () => {
          const stake = parseFloat(document.getElementById("stakeAmount").textContent);

          if (activeGames >= 1) {
            return showToast("Please wait until the current game ends.");
          }
          if (currentReservations[currentUserId]) {
            return showToast("You have already reserved a card for this round!");
          }

          // Fetch fresh balance directly from Firebase using current user context
          db.ref("users/" + currentUserId).once("value", (snapshot) => {
            let userData = snapshot.exists() ? snapshot.val() : null;
            let realWallet = 0;

            if (userData !== null) {
              if (typeof userData === "object") {
                realWallet = parseFloat(userData.balance || userData.wallet || 0);
              } else {
                realWallet = parseFloat(userData);
              }
            }

            if (realWallet < stake) {
              return showToast("⚠️ Insufficient balance (" + realWallet + " ETB)!");
            }

            // Save reservation to Firebase if balance is sufficient
            db.ref("reservations/" + currentUserId).set({
              cardIndex: selectedCardIndex,
              timestamp: Date.now()
            });
            showToast("Card reserved successfully!");
          });
        });
      }

      // 5. Real-Time Firebase Database Listeners
      db.ref("reservations").on("value", (snapshot) => {
        currentReservations = snapshot.val() || {};
        const playerKeys = Object.keys(currentReservations);
        const count = playerKeys.length;

        renderGrid();

        if (count === 1) {
          showToast("Card reserved! (1/2 players ready)");
        } else if (count === 2) {
          startCountdown();
        }
      });

      db.ref("activeGames").on("value", (snapshot) => {
        activeGames = snapshot.val() || 0;
        if (activeGamesDisplay) activeGamesDisplay.textContent = activeGames;

        if (activeGames === 1) {
          startNumberDrawing();
        } else {
          stopNumberDrawing();
        }
      });

      // 6. Live Number Calling Loop
      function startNumberDrawing() {
        drawnNumbers = [];
        showToast("📣 Game started! Drawing numbers...");
        if (currentDrawTimer) clearInterval(currentDrawTimer);

        currentDrawTimer = setInterval(() => {
          if (drawnNumbers.length >= 75) {
            clearInterval(currentDrawTimer);
            return;
          }

          let nextNum;
          do {
            nextNum = Math.floor(Math.random() * 75) + 1;
          } while (drawnNumbers.includes(nextNum));

          drawnNumbers.push(nextNum);
          showToast(`📣 Number Drawn: ${nextNum}`);
          updateCardDaubs();
        }, 4000);
      }

      function stopNumberDrawing() {
        if (currentDrawTimer) clearInterval(currentDrawTimer);
        drawnNumbers = [];
      }

      // 7. Global 30-Second Countdown Logic
      let isTimerRunning = false;
      function startCountdown() {
        if (isTimerRunning) return;
        isTimerRunning = true;

        let secondsLeft = 30;
        if (timerBanner) timerBanner.style.display = "block";
        if (countdownDisplay) countdownDisplay.textContent = secondsLeft;

        const timer = setInterval(() => {
          secondsLeft--;
          if (countdownDisplay) countdownDisplay.textContent = secondsLeft;

          if (secondsLeft <= 0) {
            clearInterval(timer);
            if (timerBanner) timerBanner.style.display = "none";
            isTimerRunning = false;

            // Reset lobby & start game state in database
            db.ref("activeGames").set(1);
            db.ref("reservations").remove();
            showToast("Game Started!");
          }
        }, 1000);
      }

      renderGrid();
      generatePreviewCard();
      if (refreshBtn) {
        refreshBtn.addEventListener("click", () => {
          renderGrid();
          generatePreviewCard();
        });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
