<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Bingo</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Telegram & Firebase Libraries -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    .toast-banner {
      position: fixed; top: -70px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fbbf24; border: 1.5px solid #f59e0b;
      padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000; white-space: nowrap;
    }
    .toast-banner.show { top: 20px; }
    .timer-banner {
      display: none; background-color: #2563eb; color: #fff;
      text-align: center; padding: 8px; margin: 10px 0; border-radius: 6px;
      font-weight: bold; font-size: 14px;
    }
    .selector-cell.occupied {
      background-color: #2563eb !important; color: #ffffff !important; pointer-events: none;
    }
    /* Account Picker Modal / Box */
    .account-picker {
      background: #1e293b; border: 1px solid #334155; padding: 10px; border-radius: 8px;
      margin-bottom: 10px; font-size: 12px; color: #f8fafc; text-align: center;
    }
    .account-picker select {
      background: #0f172a; color: #38bdf8; border: 1px solid #475569; padding: 4px 8px; border-radius: 4px; margin-top: 4px;
    }
  </style>
</head>
<body>

  <div id="toastBanner" class="toast-banner"></div>

  <div class="game-container">
    
    <!-- Top Stats Bar -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-title">Wallet</span>
        <span class="stat-value" id="walletBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Bonus</span>
        <span class="stat-value" id="bonusBalance">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Active Game</span>
        <span class="stat-value" id="activeGames">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Stake</span>
        <span class="stat-value" id="stakeAmount">10</span>
      </div>
    </div>

    <!-- Account Picker Box to Fix Mismatched IDs -->
    <div class="account-picker" id="accountPickerBox">
      <div>Select Your Firebase Account ID:</div>
      <select id="accountSelect"><option value="">Scanning Database...</option></select>
    </div>

    <!-- Countdown Timer Banner -->
    <div id="timerBanner" class="timer-banner">
      2 Cards Reserved! Game starting in <span id="countdown">30</span>s...
    </div>

    <!-- 100-Card Selector Grid -->
    <div class="card-selector-grid" id="cardSelectorGrid"></div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <div class="bingo-card" id="bingoCardPreview"></div>

      <div class="action-buttons">
        <button id="refreshBtn">Refresh</button>
        <button id="startBtn">Start game</button>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSPvq-XVlhjufHT-MHhjrirTk0W3d-nTg",
      authDomain: "addis-bingo-149fc.firebaseapp.com",
      databaseURL: "https://addis-bingo-149fc-default-rtdb.firebaseio.com",
      projectId: "addis-bingo-149fc",
      storageBucket: "addis-bingo-149fc.firebasestorage.app",
      messagingSenderId: "263720616222",
      appId: "1:263720616222:web:493bd0e0c08a22f2afc90f",
      measurementId: "G-QMN2VY8FRS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    let tgUserId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null;
    let currentUserId = localStorage.getItem("addis_bingo_locked_uid") || tgUserId;

    function showToast(msg) {
      const toast = document.getElementById("toastBanner");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function initGame() {
      const grid = document.getElementById("cardSelectorGrid");
      const preview = document.getElementById("bingoCardPreview");
      const startBtn = document.getElementById("startBtn");
      const refreshBtn = document.getElementById("refreshBtn");
      const activeGamesDisplay = document.getElementById("activeGames");
      const timerBanner = document.getElementById("timerBanner");
      const countdownDisplay = document.getElementById("countdown");
      const accountSelect = document.getElementById("accountSelect");

      let selectedCardIndex = 1;
      let currentReservations = {};
      let activeGames = 0;
      let drawnNumbers = [];
      let currentDrawTimer = null;

      // Scan all nodes in database to populate the Account Picker dropdown
      function scanDatabaseAccounts() {
        db.ref("/").once("value", (snapshot) => {
          if (!snapshot.exists()) return;
          const rootData = snapshot.val();
          accountSelect.innerHTML = '<option value="">-- Choose your account --</option>';
          
          let foundAccounts = [];

          // Look into common root keys like users, balances, players
          ["users", "balances", "players", "wallets"].forEach(rootKey => {
            if (rootData[rootKey] && typeof rootData[rootKey] === "object") {
              Object.keys(rootData[rootKey]).forEach(userId => {
                const userData = rootData[rootKey][userId];
                let bal = 0;
                if (typeof userData === "object" && userData !== null) {
                  bal = userData.balance !== undefined ? userData.balance : (userData.wallet !== undefined ? userData.wallet : 0);
                } else if (!isNaN(userData)) {
                  bal = userData;
                }
                foundAccounts.push({ path: `${rootKey}/${userId}`, id: userId, balance: bal });
              });
            }
          });

          foundAccounts.forEach(acc => {
            const opt = document.createElement("option");
            opt.value = acc.path;
            opt.textContent = `ID: ${acc.id} (Balance: ${acc.balance} ETB)`;
            if (acc.id === currentUserId || acc.path.includes(currentUserId)) {
              opt.selected = true;
              bindBalanceListener(acc.path, acc.balance);
            }
            accountSelect.appendChild(opt);
          });
        });
      }

      let activeBalanceRef = null;
      function bindBalanceListener(path, initialBal) {
        if (activeBalanceRef) activeBalanceRef.off();
        activeBalanceRef = db.ref(path);
        
        document.getElementById("walletBalance").textContent = Number(initialBal || 0).toFixed(2);

        activeBalanceRef.on("value", (snapshot) => {
          if (!snapshot.exists()) return;
          let val = snapshot.val();
          if (typeof val === "object" && val !== null) {
            val = val.balance !== undefined ? val.balance : (val.wallet !== undefined ? val.wallet : 0);
          }
          const finalBal = parseFloat(val) || 0;
          document.getElementById("walletBalance").textContent = finalBal.toFixed(2);
        });
      }

      accountSelect.addEventListener("change", (e) => {
        const selectedPath = e.target.value;
        if (!selectedPath) return;
        localStorage.setItem("addis_bingo_locked_path", selectedPath);
        const parts = selectedPath.split("/");
        currentUserId = parts[parts.length - 1];
        localStorage.setItem("addis_bingo_locked_uid", currentUserId);
        
        db.ref(selectedPath).once("value", (snapshot) => {
          let val = snapshot.exists() ? snapshot.val() : 0;
          if (typeof val === "object" && val !== null) {
            val = val.balance !== undefined ? val.balance : (val.wallet !== undefined ? val.wallet : 0);
          }
          bindBalanceListener(selectedPath, val);
          showToast("Account synced successfully!");
        });
      });

      // If user previously locked an account path, use it directly
      const savedPath = localStorage.getItem("addis_bingo_locked_path");
      if (savedPath) {
        db.ref(savedPath).once("value", (snapshot) => {
          if (snapshot.exists()) {
            let val = snapshot.val();
            if (typeof val === "object" && val !== null) {
              val = val.balance !== undefined ? val.balance : (val.wallet !== undefined ? val.wallet : 0);
            }
            bindBalanceListener(savedPath, val);
          }
          scanDatabaseAccounts();
        });
      } else {
        scanDatabaseAccounts();
      }

      function renderGrid() {
        if (!grid) return;
        grid.innerHTML = "";
        const reservedIndices = Object.values(currentReservations).map(r => r.cardIndex);

        for (let i = 1; i <= 100; i++) {
          const cell = document.createElement("div");
          cell.className = "selector-cell";
          cell.textContent = i;
          if (reservedIndices.includes(i)) cell.classList.add("occupied");
          if (i === selectedCardIndex && !reservedIndices.includes(i)) cell.classList.add("selected");

          cell.addEventListener("click", () => {
            if (reservedIndices.includes(i)) return;
            document.querySelectorAll(".selector-cell").forEach(c => c.classList.remove("selected"));
            cell.classList.add("selected");
            selectedCardIndex = i;
            generatePreviewCard();
          });
          grid.appendChild(cell);
        }
      }

      function getFixedNumbersForCard(cardId, colIndex, count) {
        const nums = [];
        const min = colIndex * 15 + 1;
        const max = (colIndex + 1) * 15;
        let seed = cardId * 100 + colIndex * 10;
        while (nums.length < count) {
          seed = (seed * 9301 + 49297) % 233280;
          const rand = min + Math.floor((seed / 233280) * (max - min + 1));
          if (!nums.includes(rand)) nums.push(rand);
        }
        return nums;
      }

      function updateCardDaubs() {
        if (!preview) return;
        preview.querySelectorAll(".bingo-cell").forEach(cell => {
          const val = parseInt(cell.textContent);
          if (!isNaN(val) && drawnNumbers.includes(val)) cell.classList.add("daubed");
        });
      }

      function generatePreviewCard() {
        if (!preview) return;
        preview.innerHTML = "";
        const cols = [0, 1, 2, 3, 4].map(c => getFixedNumbersForCard(selectedCardIndex, c, 5));

        for (let r = 0; r < 5; r++) {
          [cols[0][r], cols[1][r], cols[2][r], cols[3][r], cols[4][r]].forEach((num, c) => {
            const cell = document.createElement("div");
            cell.className = "bingo-cell";
            if (r === 2 && c === 2) {
              cell.textContent = "FREE";
              cell.classList.add("daubed");
            } else {
              cell.textContent = num;
              cell.addEventListener("click", () => {
                if (drawnNumbers.includes(num)) cell.classList.toggle("daubed");
                else showToast("Number hasn't been drawn yet!");
              });
            }
            preview.appendChild(cell);
          });
        }
        updateCardDaubs();
      }

      if (startBtn) {
        startBtn.addEventListener("click", () => {
          const stake = parseFloat(document.getElementById("stakeAmount").textContent);
          const currentWallet = parseFloat(document.getElementById("walletBalance").textContent) || 0;

          if (activeGames >= 1) return showToast("Please wait until current game ends.");
          if (currentReservations[currentUserId]) return showToast("You already reserved a card!");
          if (currentWallet < stake) return showToast(`⚠️ Insufficient balance (${currentWallet} ETB)!`);

          db.ref("reservations/" + currentUserId).set({
            cardIndex: selectedCardIndex,
            timestamp: Date.now()
          });
          showToast("Card reserved successfully!");
        });
      }

      db.ref("reservations").on("value", (snapshot) => {
        currentReservations = snapshot.val() || {};
        const count = Object.keys(currentReservations).length;
        renderGrid();
        if (count === 2) startCountdown();
      });

      db.ref("activeGames").on("value", (snapshot) => {
        activeGames = snapshot.val() || 0;
        if (activeGamesDisplay) activeGamesDisplay.textContent = activeGames;
        if (activeGames === 1) {
          drawnNumbers = [];
          showToast("📣 Game started!");
        }
      });

      let isTimerRunning = false;
      function startCountdown() {
        if (isTimerRunning) return;
        isTimerRunning = true;
        let secondsLeft = 30;
        if (timerBanner) timerBanner.style.display = "block";

        const timer = setInterval(() => {
          secondsLeft--;
          if (countdownDisplay) countdownDisplay.textContent = secondsLeft;
          if (secondsLeft <= 0) {
            clearInterval(timer);
            if (timerBanner) timerBanner.style.display = "none";
            isTimerRunning = false;
            db.ref("activeGames").set(1);
            db.ref("reservations").remove();
          }
        }, 1000);
      }

      renderGrid();
      generatePreviewCard();
      if (refreshBtn) refreshBtn.addEventListener("click", () => { scanDatabaseAccounts(); renderGrid(); });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
