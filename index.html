<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Top Stats Bar -->
        <div class="stats-bar">
            <div class="stat-box">
                <span class="stat-title">Wallet</span>
                <span class="stat-value">0.38</span>
            </div>
            <div class="stat-box">
                <span class="stat-title">Active Game</span>
                <span class="stat-value">2</span>
            </div>
            <div class="stat-box">
                <span class="stat-title">Stake</span>
                <span class="stat-value">10</span>
            </div>
        </div>

        <!-- Master Caller Board (1 to 75 / 100) -->
        <div class="master-board" id="masterBoard">
            <!-- JavaScript will generate numbers 1-75 here -->
        </div>

        <!-- Bottom Section: Mini Card & Controls -->
        <div class="bottom-section">
            <!-- Small Player Card Preview -->
            <div class="mini-card" id="miniCard">
                <!-- JavaScript will fill 5x5 grid -->
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="refreshBtn" onclick="refreshCard()">Refresh</button>
                <button id="startBtn" onclick="startGame()">Start game</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
