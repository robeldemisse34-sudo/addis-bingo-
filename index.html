<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Bingo</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Telegram & Firebase Libraries -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    .toast-banner {
      position: fixed; top: -70px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fbbf24; border: 1.5px solid #f59e0b;
      padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000; white-space: nowrap;
    }
    .toast-banner.show { top: 20px; }
    .timer-banner {
      display: none; background-color: #2563eb; color: #fff;
      text-align: center; padding: 8px; margin: 10px 0; border-radius: 6px;
      font-weight: bold; font-size: 14px;
    }
    .selector-cell.occupied {
      background-color: #2563eb !important; color: #ffffff !important; pointer-events: none;
    }
    .account-picker {
      background: #1e293b; border: 1px solid #334155; padding: 10px; border-radius: 8px;
      margin-bottom: 10px; font-size: 12px; color: #f8fafc; text-align: center;
    }
    .account-picker input, .account-picker select {
      background: #0f172a; color: #38bdf8; border: 1px solid #475569; padding: 6px 10px;
      border-radius: 4px; margin-top: 4px; font-size: 13px; text-align: center;
    }
    .account-picker button {
      background: #2563eb; color: #fff; border: none; padding: 6px 12px;
      border-radius: 4px; margin-left: 6px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="toastBanner" class="toast-banner"></div>

  <div class="game-container">
    
    <!-- Top Stats Bar -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-title">Wallet</span>
        <span class="stat-value" id="walletBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Bonus</span>
        <span class="stat-value" id="bonusBalance">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Active Game</span>
        <span class="stat-value" id="activeGames">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Stake</span>
        <span class="stat-value" id="stakeAmount">10</span>
      </div>
    </div>

    <!-- Direct User ID Linker -->
    <div class="account-picker">
      <div>Sync Account ID Manually:</div>
      <input type="text" id="manualUserIdInput" placeholder="Enter Telegram / User ID">
      <button id="syncUserBtn">Sync</button>
      <div style="margin-top: 6px;">
        <select id="accountSelect"><option value="">Or select detected account...</option></select>
      </div>
    </div>

    <!-- Countdown Timer Banner -->
    <div id="timerBanner" class="timer-banner">
      2 Cards Reserved! Game starting in <span id="countdown">30</span>s...
    </div>

    <!-- 100-Card Selector Grid -->
    <div class="card-selector-grid" id="cardSelectorGrid"></div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <div class="bingo-card" id="bingoCardPreview"></div>

      <div class="action-buttons">
        <button id="refreshBtn">Refresh</button>
        <button id="startBtn">Start game</button>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCSPvq-XVlhjufHT-MHhjrirTk0W3d-nTg",
      authDomain: "addis-bingo-149fc.firebaseapp.com",
      databaseURL: "https://addis-bingo-149fc-default-rtdb.firebaseio.com",
      projectId: "addis-bingo-149fc",
      storageBucket: "addis-bingo-149fc.firebasestorage.app",
      messagingSenderId: "263720616222",
      appId: "1:263720616222:web:493bd0e0c08a22f2afc90f",
      measurementId: "G-QMN2VY8FRS"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    let tgUserId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null;
    let currentUserId = localStorage.getItem("addis_bingo_locked_uid") || tgUserId;

    function showToast(msg) {
      const toast = document.getElementById("toastBanner");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function initGame() {
      const grid = document.getElementById("cardSelectorGrid");
      const preview = document.getElementById("bingoCardPreview");
      const startBtn = document.getElementById("startBtn");
      const refreshBtn = document.getElementById("refreshBtn");
      const activeGamesDisplay = document.getElementById("activeGames");
      const timerBanner = document.getElementById("timerBanner");
      const countdownDisplay = document.getElementById("countdown");
      const accountSelect = document.getElementById("accountSelect");
      const manualInput = document.getElementById("manualUserIdInput");
      const syncBtn = document.getElementById("syncUserBtn");

      let selectedCardIndex = 1;
      let currentReservations = {};
      let activeGames = 0;
      let drawnNumbers = [];
      let activeBalanceRef = null;

      if (currentUserId && manualInput) {
        manualInput.value = currentUserId;
      }

      // Safe Node Reader (Avoids Permission Denied on Root)
      function scanSpecificNodes() {
        const nodes = ["users", "balances", "players"];
        accountSelect.innerHTML = '<option value="">Searching known nodes...</option>';
        let foundAccounts = [];

        let completed = 0;
        nodes.forEach(node => {
          db.ref(node).once("value", (snapshot) => {
            completed++;
            if (snapshot.exists()) {
              const data = snapshot.val();
              Object.keys(data).forEach(id => {
                const val = data[id];
                let bal = 0;
                if (typeof val === "object" && val !== null) {
                  bal = val.balance !== undefined ? val.balance : (val.wallet !== undefined ? val.wallet : 0);
                } else if (!isNaN(val)) {
                  bal = val;
                }
                foundAccounts.push({ path: `${node}/${id}`, id: id, balance: bal });
              });
            }

            if (completed === nodes.length) {
              accountSelect.innerHTML = '<option value="">-- Select detected account --</option>';
              if (foundAccounts.length === 0) {
                accountSelect.innerHTML = '<option value="">No list access (Use manual input)</option>';
              }
              foundAccounts.forEach(acc => {
                const opt = document.createElement("option");
                opt.value = acc.path;
                opt.textContent = `ID: ${acc.id} (${acc.balance} ETB)`;
                accountSelect.appendChild(opt);
              });
            }
          }).catch(() => {
            completed++;
            if (completed === nodes.length) {
              accountSelect.innerHTML = '<option value="">Enter ID manually above</option>';
            }
          });
        });
      }

      function attachBalanceListener(uid) {
        if (!uid) return;
        if (activeBalanceRef) activeBalanceRef.off();

        // Check users/UID path first
        activeBalanceRef = db.ref(`users/${uid}`);
        activeBalanceRef.on("value", (snapshot) => {
          if (snapshot.exists()) {
            let val = snapshot.val();
            let bal = typeof val === "object" ? (val.balance ?? val.wallet ?? 0) : val;
            document.getElementById("walletBalance").textContent = Number(bal).toFixed(2);
            showToast(`Synced! Balance: ${bal} ETB`);
          } else {
            // Check direct balance node
            db.ref(`balances/${uid}`).once("value", (snap) => {
              if (snap.exists()) {
                let bal = snap.val();
                document.getElementById("walletBalance").textContent = Number(bal).toFixed(2);
                showToast(`Synced! Balance: ${bal} ETB`);
              }
            });
          }
        });
      }

      // Sync button click handler
      if (syncBtn) {
        syncBtn.addEventListener("click", () => {
          const targetId = manualInput.value.trim();
          if (!targetId) return showToast("Please enter a User ID");
          currentUserId = targetId;
          localStorage.setItem("addis_bingo_locked_uid", targetId);
          attachBalanceListener(targetId);
        });
      }

      accountSelect.addEventListener("change", (e) => {
        const path = e.target.value;
        if (!path) return;
        const uid = path.split("/").pop();
        manualInput.value = uid;
        currentUserId = uid;
        localStorage.setItem("addis_bingo_locked_uid", uid);
        attachBalanceListener(uid);
      });

      if (currentUserId) {
        attachBalanceListener(currentUserId);
      }
      scanSpecificNodes();

      function renderGrid() {
        if (!grid) return;
        grid.innerHTML = "";
        const reservedIndices = Object.values(currentReservations).map(r => r.cardIndex);

        for (let i = 1; i <= 100; i++) {
          const cell = document.createElement("div");
          cell.className = "selector-cell";
          cell.textContent = i;
          if (reservedIndices.includes(i)) cell.classList.add("occupied");
          if (i === selectedCardIndex && !reservedIndices.includes(i)) cell.classList.add("selected");

          cell.addEventListener("click", () => {
            if (reservedIndices.includes(i)) return;
            document.querySelectorAll(".selector-cell").forEach(c => c.classList.remove("selected"));
            cell.classList.add("selected");
            selectedCardIndex = i;
            generatePreviewCard();
          });
          grid.appendChild(cell);
        }
      }

      function getFixedNumbersForCard(cardId, colIndex, count) {
        const nums = [];
        const min = colIndex * 15 + 1;
        const max = (colIndex + 1) * 15;
        let seed = cardId * 100 + colIndex * 10;
        while (nums.length < count) {
          seed = (seed * 9301 + 49297) % 233280;
          const rand = min + Math.floor((seed / 233280) * (max - min + 1));
          if (!nums.includes(rand)) nums.push(rand);
        }
        return nums;
      }

      function updateCardDaubs() {
        if (!preview) return;
        preview.querySelectorAll(".bingo-cell").forEach(cell => {
          const val = parseInt(cell.textContent);
          if (!isNaN(val) && drawnNumbers.includes(val)) cell.classList.add("daubed");
        });
      }

      function generatePreviewCard() {
        if (!preview) return;
        preview.innerHTML = "";
        const cols = [0, 1, 2, 3, 4].map(c => getFixedNumbersForCard(selectedCardIndex, c, 5));

        for (let r = 0; r < 5; r++) {
          [cols[0][r], cols[1][r], cols[2][r], cols[3][r], cols[4][r]].forEach((num, c) => {
            const cell = document.createElement("div");
            cell.className = "bingo-cell";
            if (r === 2 && c === 2) {
              cell.textContent = "FREE";
              cell.classList.add("daubed");
            } else {
              cell.textContent = num;
              cell.addEventListener("click", () => {
                if (drawnNumbers.includes(num)) cell.classList.toggle("daubed");
                else showToast("Number hasn't been drawn yet!");
              });
            }
            preview.appendChild(cell);
          });
        }
        updateCardDaubs();
      }

      if (startBtn) {
        startBtn.addEventListener("click", () => {
          const stake = parseFloat(document.getElementById("stakeAmount").textContent);
          const currentWallet = parseFloat(document.getElementById("walletBalance").textContent) || 0;

          if (activeGames >= 1) return showToast("Please wait until current game ends.");
          if (currentReservations[currentUserId]) return showToast("You already reserved a card!");
          if (currentWallet < stake) return showToast(`⚠️ Insufficient balance (${currentWallet} ETB)!`);

          db.ref("reservations/" + currentUserId).set({
            cardIndex: selectedCardIndex,
            timestamp: Date.now()
          });
          showToast("Card reserved successfully!");
        });
      }

      db.ref("reservations").on("value", (snapshot) => {
        currentReservations = snapshot.val() || {};
        renderGrid();
      });

      db.ref("activeGames").on("value", (snapshot) => {
        activeGames = snapshot.val() || 0;
        if (activeGamesDisplay) activeGamesDisplay.textContent = activeGames;
      });

      renderGrid();
      generatePreviewCard();
      if (refreshBtn) refreshBtn.addEventListener("click", () => { scanSpecificNodes(); renderGrid(); });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
