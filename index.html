<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Master Caller Board (1 to 75) -->
        <div class="master-board" id="masterBoard"></div>

        <!-- Main Player Card (5x5) -->
        <div class="bingo-card" id="bingoCard"></div>

        <!-- Action Controls -->
        <div class="action-buttons">
            <button id="refreshBtn" onclick="refreshCard()">Refresh Card</button>
            <button id="bingoBtn" onclick="declareBingo()">BINGO!</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
