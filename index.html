<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Bingo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    
    <!-- Top Stats Bar -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-title">Wallet</span>
        <span class="stat-value" id="walletBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Bonus</span>
        <span class="stat-value" id="bonusBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Stake</span>
        <span class="stat-value" id="stakeAmount">10</span>
      </div>
    </div>

    <!-- 100-Card Selector Grid -->
    <div class="card-selector-grid" id="cardSelectorGrid"></div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <div class="bingo-card" id="bingoCardPreview"></div>

      <div class="action-buttons">
        <button id="refreshBtn">Refresh</button>
        <button id="startBtn">Start game</button>
      </div>
    </div>

  </div>

  <script>
    function initGame() {
      const grid = document.getElementById("cardSelectorGrid");
      const preview = document.getElementById("bingoCardPreview");
      const refreshBtn = document.getElementById("refreshBtn");
      let selectedCardIndex = 1;

      // 1. Generate 100 selector cells
      function renderGrid() {
        if (!grid) return;
        grid.innerHTML = "";
        for (let i = 1; i <= 100; i++) {
          const cell = document.createElement("div");
          cell.className = "selector-cell";
          cell.textContent = i;
          if (i === selectedCardIndex) cell.classList.add("selected");
          
          cell.addEventListener("click", () => {
            document.querySelectorAll(".selector-cell").forEach(c => c.classList.remove("selected"));
            cell.classList.add("selected");
            selectedCardIndex = i;
            generatePreviewCard();
          });
          grid.appendChild(cell);
        }
      }

      // Helper to generate unique random numbers within a range
      function getRandomNumbers(min, max, count) {
        const nums = [];
        while (nums.length < count) {
          const rand = Math.floor(Math.random() * (max - min + 1)) + min;
          if (!nums.includes(rand)) nums.push(rand);
        }
        return nums;
      }

      // 2. Generate 5x5 Bingo Preview Card with precise row ranges
      function generatePreviewCard() {
        if (!preview) return;
        preview.innerHTML = "";

        // Standard 5x5 Bingo row ranges
        const row1 = getRandomNumbers(1, 15, 5);   // 1 to 15
        const row2 = getRandomNumbers(16, 30, 5);  // 16 to 30
        const row3 = getRandomNumbers(31, 45, 5);  // 31 to 45
        const row4 = getRandomNumbers(46, 60, 5);  // 46 to 60
        const row5 = getRandomNumbers(61, 75, 5);  // 61 to 75

        // Combine all rows into a single grid array
        const cardNumbers = [...row1, ...row2, ...row3, ...row4, ...row5];

        cardNumbers.forEach((num, index) => {
          const cell = document.createElement("div");
          cell.className = "bingo-cell";
          
          // Center element (Index 12: Row 3, Cell 3) is FREE
          if (index === 12) {
            cell.textContent = "FREE";
            cell.classList.add("daubed");
          } else {
            cell.textContent = num;
          }
          preview.appendChild(cell);
        });
      }

      renderGrid();
      generatePreviewCard();

      if (refreshBtn) {
        refreshBtn.addEventListener("click", generatePreviewCard);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
