<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Bingo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    
    <!-- Top Stats Bar: Clean 3-Pill Oval Layout -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-title">Wallet</span>
        <span class="stat-value" id="walletBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Bonus</span>
        <span class="stat-value" id="bonusBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Stake</span>
        <span class="stat-value" id="stakeAmount">10</span>
      </div>
    </div>

    <!-- 100-Card Selector Grid -->
    <div class="card-selector-grid" id="cardSelectorGrid">
      <!-- Grid cells 1 to 100 generated by JS -->
    </div>

    <!-- Bottom Section: Selected Bingo Card & Control Buttons -->
    <div class="bottom-section">
      <div class="bingo-card" id="bingoCardPreview">
        <!-- 5x5 Bingo Card Grid generated by JS -->
      </div>

      <div class="action-buttons">
        <button id="refreshBtn">Refresh</button>
        <button id="startBtn">Start game</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
