<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Bingo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    
    <!-- Top Stats Bar -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-title">Wallet</span>
        <span class="stat-value" id="walletBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Bonus</span>
        <span class="stat-value" id="bonusBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Stake</span>
        <span class="stat-value" id="stakeAmount">10</span>
      </div>
    </div>

    <!-- 100-Card Selector Grid -->
    <div class="card-selector-grid" id="cardSelectorGrid"></div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <div class="bingo-card" id="bingoCardPreview"></div>

      <div class="action-buttons">
        <button id="refreshBtn">Refresh</button>
        <button id="startBtn">Start game</button>
      </div>
    </div>

  </div>

  <script>
    function initGame() {
      const grid = document.getElementById("cardSelectorGrid");
      const preview = document.getElementById("bingoCardPreview");
      const refreshBtn = document.getElementById("refreshBtn");
      let selectedCardIndex = 1;

      // 1. Generate 100 selector cells
      function renderGrid() {
        if (!grid) return;
        grid.innerHTML = "";
        for (let i = 1; i <= 100; i++) {
          const cell = document.createElement("div");
          cell.className = "selector-cell";
          cell.textContent = i;
          if (i === selectedCardIndex) cell.classList.add("selected");
          
          cell.addEventListener("click", () => {
            document.querySelectorAll(".selector-cell").forEach(c => c.classList.remove("selected"));
            cell.classList.add("selected");
            selectedCardIndex = i;
            generatePreviewCard();
          });
          grid.appendChild(cell);
        }
      }

      // 2. Generate 5x5 Bingo Preview Card
      function generatePreviewCard() {
        if (!preview) return;
        preview.innerHTML = "";
        const numbers = [];
        while (numbers.length < 25) {
          const rand = Math.floor(Math.random() * 75) + 1;
          if (!numbers.includes(rand)) numbers.push(rand);
        }

        numbers.forEach((num, index) => {
          const cell = document.createElement("div");
          cell.className = "bingo-cell";
          if (index === 12) {
            cell.textContent = "FREE";
            cell.classList.add("daubed");
          } else {
            cell.textContent = num;
          }
          preview.appendChild(cell);
        });
      }

      renderGrid();
      generatePreviewCard();

      if (refreshBtn) {
        refreshBtn.addEventListener("click", generatePreviewCard);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
