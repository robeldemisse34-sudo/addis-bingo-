<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Bingo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    
    <!-- Top Stats Bar: Wallet, Bonus, Active Game, Stake -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-title">Wallet</span>
        <span class="stat-value" id="walletBalance">0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Bonus</span>
        <span class="stat-value" id="bonusBalance">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Active Game</span>
        <span class="stat-value" id="activeGames">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-title">Stake</span>
        <span class="stat-value" id="stakeAmount">10</span>
      </div>
    </div>

    <!-- 100-Card Selector Grid -->
    <div class="card-selector-grid" id="cardSelectorGrid"></div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <div class="bingo-card" id="bingoCardPreview"></div>

      <div class="action-buttons">
        <button id="refreshBtn">Refresh</button>
        <button id="startBtn">Start game</button>
      </div>
    </div>

  </div>

  <script>
    function initGame() {
      const grid = document.getElementById("cardSelectorGrid");
      const preview = document.getElementById("bingoCardPreview");
      const refreshBtn = document.getElementById("refreshBtn");
      const startBtn = document.getElementById("startBtn");
      const activeGamesDisplay = document.getElementById("activeGames");

      let selectedCardIndex = 1;
      let activeGamesCount = 0;
      const MAX_ACTIVE_GAMES = 2; // Set max active limit (1 or 2)

      // 1. Generate 100 selector cells
      function renderGrid() {
        if (!grid) return;
        grid.innerHTML = "";
        for (let i = 1; i <= 100; i++) {
          const cell = document.createElement("div");
          cell.className = "selector-cell";
          cell.textContent = i;
          if (i === selectedCardIndex) cell.classList.add("selected");
          
          cell.addEventListener("click", () => {
            document.querySelectorAll(".selector-cell").forEach(c => c.classList.remove("selected"));
            cell.classList.add("selected");
            selectedCardIndex = i;
            generatePreviewCard();
          });
          grid.appendChild(cell);
        }
      }

      // Helper to generate unique random numbers within a range
      function getRandomNumbers(min, max, count) {
        const nums = [];
        while (nums.length < count) {
          const rand = Math.floor(Math.random() * (max - min + 1)) + min;
          if (!nums.includes(rand)) nums.push(rand);
        }
        return nums;
      }

      // 2. Generate 5x5 Bingo Card by Column (B-I-N-G-O)
      function generatePreviewCard() {
        if (!preview) return;
        preview.innerHTML = "";

        // Standard 5x5 Bingo Column Ranges
        const colB = getRandomNumbers(1, 15, 5);   // Column 1 (B: 1-15)
        const colI = getRandomNumbers(16, 30, 5);  // Column 2 (I: 16-30)
        const colN = getRandomNumbers(31, 45, 5);  // Column 3 (N: 31-45)
        const colG = getRandomNumbers(46, 60, 5);  // Column 4 (G: 46-60)
        const colO = getRandomNumbers(61, 75, 5);  // Column 5 (O: 61-75)

        // Read row-by-row for 5x5 grid layout rendering
        for (let row = 0; row < 5; row++) {
          const rowNumbers = [colB[row], colI[row], colN[row], colG[row], colO[row]];
          
          rowNumbers.forEach((num, col) => {
            const cell = document.createElement("div");
            cell.className = "bingo-cell";
            
            // Middle cell (Row 2, Col 2) is FREE
            if (row === 2 && col === 2) {
              cell.textContent = "FREE";
              cell.classList.add("daubed");
            } else {
              cell.textContent = num;
            }
            preview.appendChild(cell);
          });
        }
      }

      // 3. Handle Active Games & Alert Message
      if (startBtn) {
        startBtn.addEventListener("click", () => {
          if (activeGamesCount >= MAX_ACTIVE_GAMES) {
            alert("Please wait until the current game is ended before starting a new one.");
          } else {
            activeGamesCount++;
            activeGamesDisplay.textContent = activeGamesCount;
            alert(`Game started for Card #${selectedCardIndex}!`);
          }
        });
      }

      renderGrid();
      generatePreviewCard();

      if (refreshBtn) {
        refreshBtn.addEventListener("click", generatePreviewCard);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
