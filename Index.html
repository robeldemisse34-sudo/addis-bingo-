<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Bingo Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #ffffff; text-align: center; padding: 15px; }
    .header { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .balance { font-size: 18px; color: #4CAF50; font-weight: bold; margin-top: 5px; }
    .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 350px; overflow-y: auto; padding: 5px; }
    .card-btn { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 12px 5px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .card-btn.selected { background: #ff9800; border-color: #ff9800; }
    .play-btn { background: #4CAF50; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 20px; width: 100%; cursor: pointer; }
    .play-btn:disabled { background: #555; }
    .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 15px; }
    .cell { background: #333; padding: 15px 0; font-weight: bold; border-radius: 4px; font-size: 16px; }
    .cell.header-cell { background: #e91e63; color: white; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🎰 ADDIS BINGO 🎰</h2>
    <div class="balance">Wallet Balance: <span id="user-balance">100.00</span> ETB</div>
  </div>

  <div id="card-selection-screen">
    <h3>Select Your Bingo Card (1-100)</h3>
    <p style="font-size:12px; color:#aaa; margin-bottom:10px;">Entry Fee: 10 ETB</p>
    <div class="card-grid" id="grid-container"></div>
    <button class="play-btn" id="lock-btn" disabled onclick="startGame()">Lock In Card & Play</button>
  </div>

  <div id="game-screen" style="display:none;">
    <h3 id="selected-card-title">Card #--</h3>
    <div class="board">
      <div class="cell header-cell">B</div>
      <div class="cell header-cell">I</div>
      <div class="cell header-cell">N</div>
      <div class="cell header-cell">G</div>
      <div class="cell header-cell">O</div>
    </div>
    <div class="board" id="bingo-numbers"></div>
    <button class="play-btn" style="background:#f44336;" onclick="resetGame()">Exit to Menu</button>
  </div>

  <script>
    let selectedCard = null;
    let balance = 100.00;
    const gridContainer = document.getElementById('grid-container');

    // Generate Cards #001 to #100
    for (let i = 1; i <= 100; i++) {
      const btn = document.createElement('button');
      btn.className = 'card-btn';
      btn.innerText = '#' + String(i).padStart(3, '0');
      btn.onclick = () => selectCard(btn, i);
      gridContainer.appendChild(btn);
    }

    function selectCard(btn, num) {
      document.querySelectorAll('.card-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCard = num;
      document.getElementById('lock-btn').disabled = false;
      document.getElementById('lock-btn').innerText = `Lock Card #${String(num).padStart(3, '0')} (10 ETB)`;
    }

    function startGame() {
      if (balance < 10) { alert('Insufficient balance!'); return; }
      balance -= 10;
      document.getElementById('user-balance').innerText = balance.toFixed(2);
      document.getElementById('card-selection-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      document.getElementById('selected-card-title').innerText = `Playing Card #${String(selectedCard).padStart(3, '0')}`;
      generateBoard();
    }

    function generateBoard() {
      const boardContainer = document.getElementById('bingo-numbers');
      boardContainer.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerText = i === 12 ? 'FREE' : Math.floor(Math.random() * 75) + 1;
        if(i === 12) cell.style.background = '#ff9800';
        boardContainer.appendChild(cell);
      }
    }

    function resetGame() {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('card-selection-screen').style.display = 'block';
    }

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
